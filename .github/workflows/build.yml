name: Mini Shell CI

on:
  push:
    branches: ["core"]
  pull_request:
    branches: ["core"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build mini-shell
        run: make

      - name: Run tests
        run: make test
